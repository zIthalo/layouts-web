<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/style.css">
    <title>Tabela de Preços</title>
</head>

<body>

    <section class="pricing" aria-label="Planos de assinatura">

        <!-- ===== PLANO BASIC ===== -->
        <article class="plano">
            <h2>Basic</h2>

            <p class="preco" aria-label="10 dólares por mês">
                <span aria-hidden="true" class="moeda">$</span><span aria-hidden="true" class="valor">10</span><span aria-hidden="true" class="periodo">/mo</span>
            </p>

            <ul class="beneficios">
                <li>
                    <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" /><path d="M9 3v2h6V3" /></svg>
                    Freit
                </li>
                <li>
                    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" /></svg>
                    Coton
                </li>
                <li>
                    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z" /><circle cx="12" cy="10" r="2.5" /></svg>
                    Ederpring
                </li>
                <li>
                    <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 4-7 8-7s8 3 8 7" /></svg>
                    Lolck
                </li>
            </ul>

            <button type="button" class="cta">Call to Action</button>
        </article>

        <!-- ===== PLANO PRO (destaque) ===== -->
        <article class="plano">
            <span class="badge">Most popular</span>

            <h2>Pro</h2>

            <p class="preco" aria-label="30 dólares por mês">
                <span aria-hidden="true" class="moeda">$</span><span aria-hidden="true" class="valor">30</span><span aria-hidden="true" class="periodo">/mo</span>
            </p>

            <ul class="beneficios">
                <li>
                    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 4h12v16l-6-3-6 3z" /></svg>
                    Crevion
                </li>
                <li>
                    <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 4-7 8-7s8 3 8 7" /></svg>
                    Caring
                </li>
                <li>
                    <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M8.5 12.5l2.5 2.5 4.5-5" /></svg>
                    Ederpring
                </li>
                <li>
                    <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" /><path d="M8 12l2.5 2.5L16 9" /></svg>
                    Stme
                </li>
            </ul>

            <button type="button" class="cta">Call to Action</button>
        </article>

        <!-- ===== PLANO ENTERPRISE ===== -->
        <article class="plano">
            <h2>Enterprise</h2>

            <p class="preco" aria-label="90 dólares por mês">
                <span aria-hidden="true" class="moeda">$</span><span aria-hidden="true" class="valor">90</span><span aria-hidden="true" class="periodo">/mo</span>
            </p>

            <ul class="beneficios">
                <li>
                    <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" /><path d="M8 8h8M8 12h8M8 16h5" /></svg>
                    Vaven
                </li>
                <li>
                    <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="M3 7l9 6 9-6" /></svg>
                    Condich
                </li>
                <li>
                    <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" /></svg>
                    Exee
                </li>
                <li>
                    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z" /><path d="M14 3v4h4" /></svg>
                    Cramer
                </li>
            </ul>

            <button type="button" class="cta">Call to Action</button>
        </article>

    </section>

</body>

</html>
